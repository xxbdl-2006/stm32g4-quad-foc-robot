# ============================================================================
#  controllers.yaml —— ros2_control 路径的控制器配置
#
#  这条路径与 arm_control 直接节点路径**互斥**（两套控制律同时下发指令会
#  互相打架）。它的价值是能直接复用官方的标准控制器：
#    · joint_trajectory_controller —— 带前瞻的多轴同步轨迹插补
#    · rqt_joint_trajectory_controller —— 拖滑条手动点动，首次上电调试用
#
#  为什么不用它做取放任务：任务层需要的是"末端位姿 → 逆解 → 关节序列"，
#  而 joint_trajectory_controller 吃的是关节轨迹 —— 中间那层逆解与笛卡尔
#  路径规划仍然得有人做（就是 arm_control 的 arm_control_core）。
#  所以常规取放走 arm_control，需要标准轨迹控制器时才切到这条路径。
# ============================================================================
controller_manager:
  ros__parameters:
    update_rate: 100          # Hz，与 /hw/motor_states 的 100Hz 聚合频率对齐

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    arm_joint_group_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

# ---------------------------------------------------------------------------
# 关节状态广播：robot_state_publisher 靠它算 TF
# ---------------------------------------------------------------------------
joint_state_broadcaster:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4

# ---------------------------------------------------------------------------
# 关节轨迹控制器：多轴同步轨迹
#
# command_interfaces 用 position 而不是 velocity：
#   驱动板的 position 模式是"给定目标角 -> 板内位置环"，精度取决于编码器
#   分辨率（14bit 单圈，折算到输出轴约 0.022°），对取放够用；而且位置指令
#   的抗丢帧能力比速度指令强得多 —— 丢一帧速度指令会让关节少走一段，
#   丢一帧位置指令只是晚一个周期到位。
#
# J4 是直线轴：它的位置单位是**米**（URDF 里声明为 prismatic），
# hw_ros2_control 内部负责米 <-> 丝杠转角的换算。
# ---------------------------------------------------------------------------
arm_joint_trajectory_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: false

    constraints:
      # 到位判据：与 arm_control 的 tolerance 保持一致
      stopped_velocity_tolerance: 0.02
      goal_time: 0.5
      joint_1:
        trajectory: 0.02
        goal: 0.01
      joint_2:
        trajectory: 0.02
        goal: 0.01
      joint_3:
        trajectory: 0.02
        goal: 0.01
      joint_4:
        trajectory: 0.001   # m
        goal: 0.001

    state_publish_rate: 50.0
    action_monitor_rate: 20.0

# ---------------------------------------------------------------------------
# 关节组速度控制器：只用于"手动点动"和单轴标定
#    ros2 topic pub --once /arm_joint_group_velocity_controller/commands \
#        std_msgs/msg/Float64MultiArray "{data: [0.2, 0, 0, 0]}"
# 点动时务必用很小的速度（< 0.3 rad/s）：这个接口没有加速度限制，
# 直接给一个大的速度指令会让关节以最大电流冲到那个速度。
# ---------------------------------------------------------------------------
arm_joint_group_velocity_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
    interface_name: velocity
    command_interfaces:
      - velocity
    state_interfaces:
      - position
      - velocity
