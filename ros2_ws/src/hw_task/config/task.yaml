# ============================================================================
#  task.yaml —— 取放任务参数
#
#  这份文件里的每个数字都能追溯到某个物理量或某次实测。改之前先看注释。
#  与睿抗比赛 demo 的对应关系写在 docs/06_task_control.md 里。
#
#  高度都以**工作台面**为基准（基座系的 z = 0），不是以末端零位为基准。
#  机械臂能到的高度范围是 0.005 ~ 0.140 m，超出这个范围的目标会被
#  arm_control 以"超出升降行程"拒绝。
# ============================================================================

/**:
  ros__parameters:
    use_sim_time: false

# ---------------------------------------------------------------------------
# 状态机与任务执行
# ---------------------------------------------------------------------------
task_executor:
  ros__parameters:
    # 50 Hz。再高没有必要（关节位置环是 1 kHz、视觉 30 Hz），
    # 再低会让 SETTLE / RELEASE 这类短状态的时间分辨率变差。
    control_rate_hz: 50.0

    base_frame: "base_link"
    camera_frame: "camera_optical_frame"
    publish_targets: true

    # ---- 相机内参 ----
    # 用 ros2 run camera_calibration cameracalibrator 标出来填这里。
    # 下面这组是 640x480、4mm 焦距、1/4" 传感器的典型值，**必须重新标定**。
    # 内参错 5%，在 0.6m 距离上就是 30mm 的定位误差 —— 直接抓空。
    camera:
      fx: 600.0
      fy: 600.0
      cx: 320.0
      cy: 240.0
      width: 640
      height: 480
      k1: 0.0
      k2: 0.0

    # ---- 视觉判据 ----
    # min/max_area_px 直接沿用 demo 的 2000 / 30000：
    # 那个范围是在同样的物块尺寸与相机高度下试出来的，实测仍然合适。
    vision:
      min_area_px: 2000.0
      max_area_px: 30000.0
      min_confidence: 0.55
      # 连续 3 帧才算稳定。demo 用的是"同角度出现两次"，
      # 这里改成台面坐标下的连续帧计数（见 block_tracker.hpp）。
      min_stable_frames: 3

    # ---- 数据关联 ----
    tracker:
      # 机械臂在最大关节速度下末端最快约 0.35 m/s，视觉周期 33ms 内位移 12mm；
      # 加上投影噪声，40mm 有足够余量，又小于物块尺寸（80mm）不会串到隔壁。
      match_radius: 0.040
      max_missing_frames: 5
      track_ttl: 20.0

    # ---- 可达范围（距基座回转轴的半径）----
    # 下限不是几何最小值（|a1-(a2+a3)| = 6cm），而是机械干涉决定的：
    # 再往里走小臂会撞上 Φ120 的基座法兰。
    # 上限取 0.40 而不是理论最大 0.42 —— 末端在最大伸展处接近奇异，
    # 关节速度被放大，视觉的几毫米误差会变成很大的关节角速度。
    reach:
      radius_min: 0.12
      radius_max: 0.40

    # ---- 末端高度（台面 z = 0）----
    height:
      hover_z: 0.050      # 接近时的悬停高度（台面上方 50mm）
      touch_z: 0.023      # 下压到位：物块高 25mm，压下 2mm 过盈
                          # 【为什么要有过盈】Z 轴是位置开环 + 丝杠传动的，
                          # 累积误差在 0.2mm 量级；留 2mm 过盈让吸盘压住物块
                          # 表面，比"悬空 1mm 就开始抽真空"可靠得多
      travel_z: 0.100     # 搬运高度（越过工作台上最高的夹具与物块）
      retreat_z: 0.080    # 释放后退开的高度

    # ---- 到位判据 ----
    tolerance:
      pos_m: 0.0020       # 位置容差 2mm：视觉重复精度约 1mm，机械重复定位 0.2mm
      vel_mps: 0.010      # 末端合成速度容差
      servo_m: 0.0015     # 视觉伺服收敛阈值。
                          # 【为什么必须比噪声大】视觉位置噪声约 1.2mm，
                          # 阈值比它小的话收敛判据永远不满足，机械臂会在
                          # 目标附近无限微调下去 —— 表现为"到了但不动"。

    # ---- 超时 ----
    timeout:
      scan: 12.0
      approach: 8.0       # 末端移动 + 绕行；比底盘方案短得多，因为不需要行驶
      align: 6.0
      settle: 0.30        # 等谐波减速器的残余振动衰减（10~30Hz 频带）
      descend: 0.25
      grasp: 1.5          # 等压力达标
      lift: 0.25
      haul: 12.0
      place: 6.0
      release: 0.40
      retreat: 0.60
      vision_lost: 0.60   # 丢视觉超过此时长就退回扫描

    # ---- 重试 ----
    retry:
      scan: 3
      align: 2
      grasp: 2            # 吸不住时重新对位再试的次数

    # ---- 气泵（真空吸盘）----
    # demo 里是 gripper.on() / .off() 两个动作；这里升级成：
    #   · use_pressure_mode: true 让驱动板的压力环维持真空（硬件已实现）
    #     好处是漏气时驱动板自动加大功率，上位机只需看压力是否达标
    #   · use_pressure_check: true 用压力判定"真吸住了"，
    #     而不是 demo 的"定时到了就算吸住"—— 后者会漏判压在物块边缘吸空
    pump:
      grasp_duty: 1.0
      hold_duty: 0.75     # 搬运途中降占空比：【为什么】24V/5A 的泵满功率
                          # 连续工作 3 分钟就会让 MOS 到 110°C，
                          # 维持真空只需要 ~75%
      use_pressure_check: true
      use_pressure_mode: true
      vacuum_target_kpa: -25.0    # 压力环目标（表压，真空为负）
      vacuum_threshold_kpa: 6.0   # 压力绝对值超过此值判为吸住

    # ---- 投放 ----
    # 【与 demo 的关系】demo 是 SCARA 在同一个 XY 上按 0.055m 一层往上码垛。
    # 本机构有独立的升降轴，所以能真的做码垛 —— 这一条与 demo 一致。
    # 相比之下"只能平铺"是不成立的：那才是没有 Z 自由度的方案的限制。
    #
    # 【码垛需要注意的】每层的落点误差会累积。place_layer_height 必须按
    # 实物块的实测高度填（不是标称值），否则第四层会明显偏斜。
    place:
      mode: "stack"       # stack = 同槽位叠高；array = 单层排开
      x: 0.28             # 基座系投放点。注意必须落在 reach 环带内
      y: -0.14
      yaw: 0.0
      pitch: 0.090        # 槽位间距 = 物块外接圆直径 80mm + 10mm 取放余量
      row_pitch: 0.090
      columns: 3
      rows: 3
      layer_height: 0.025 # 物块高度（实测值，不是标称）
      max_layers: 4       # 4 层 × 25mm + touch_z 23mm = 123mm < 行程上限 140mm

    # ---- 起点（回原点用。也是扫描期间停的位置）----
    # 【为什么扫描时要停到这里】相机固定在工作台上方俯视，机械臂停在
    # 工作区中间会把物块挡住，视觉侧永远等不到稳定目标 ——
    # 症状是"卡在 SCAN 不动"，看起来像视觉坏了，其实是自己挡了镜头。
    home:
      x: 0.28
      y: 0.00
      z: 0.100
      yaw: 0.0

# ---------------------------------------------------------------------------
# 物块识别
# ---------------------------------------------------------------------------
block_detector:
  ros__parameters:
    image_topic: "/image_raw"

    # 【为什么默认不镜像】demo 里的 cv2.flip(frame, 1) 是因为它用的是一个
    # 摆在桌上、镜头朝向操作者的 USB 摄像头，镜像后操作手感才对。
    # 这里相机固定朝下俯视工作台，镜像会把像素 x 轴翻过来，
    # 而投影链路按标准 OpenCV 约定（x 向右）写的 —— 镜像之后左右会反，
    # 抓取点会偏到物块的镜像位置。只在换成后视相机时才需要打开。
    flip_horizontal: false

    # ROI：只在这个矩形里做检测，坐标会自动加回全图偏移。
    # demo 用的是 x0=145, x1=460, y0=160, y1=380。
    # 这里是 640x480 的俯视相机，工作区落在画面中部偏下。
    # 全 0 表示不裁剪。
    roi:
      x0: 60
      x1: 580
      y0: 60
      y1: 420

    min_area_px: 2000.0
    max_area_px: 30000.0
    morph_kernel: 5
    use_sharpen: true

    # 像素域的预筛（真正的工作台坐标稳定判据在 task_executor 里）。
    # 两个数都是"减负"用的：把明显抖动的东西先挡掉，不参与后续投影。
    prefilter_stable_frames: 2
    prefilter_radius_px: 40.0

    max_blocks_per_frame: 8
    debug_view: false        # true 会弹出 OpenCV 窗口显示检测结果
